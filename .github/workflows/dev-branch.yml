name: Dev Branch CI

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  call-qa-workflow:
    uses: ./.github/workflows/reusable-qa.yml
    secrets: inherit

  build-checks:
    needs: call-qa-workflow
    runs-on: macos-latest
    steps:
      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run Bun Install
        run: bun install

      - name: Build Frontend (Vite)
        run: bun run build

      - name: Build Tauri Application (Dry Run)
        run: bun run tauri build --bundles dmg --debug